services:
  server:
    build:
      context: ..
      dockerfile: sellerclaw-agent/runtime/Dockerfile
      target: staging
      args:
        SELLERCLAW_AGENT_VERSION: "${SELLERCLAW_AGENT_VERSION:-0.0.0+unknown}"
        # pypi (default) = production behaviour. Set to "local" only via the
        # Makefile dev flow (gitignored dev.env) to install sellerclaw-cli from a
        # local source checkout instead of PyPI. ./setup.sh never sets this.
        SELLERCLAW_CLI_SOURCE: "${SELLERCLAW_CLI_SOURCE:-pypi}"
        # OpenClaw base-image source (see runtime/Dockerfile). Both ARGs default
        # to the upstream release on ghcr.io (defaults pinned in Dockerfile ARGs).
        # Override OPENCLAW_REPO to point at our pinned-builds package
        # (ghcr.io/sellerai-com/openclaw-pinned), and OPENCLAW_TAG to a
        # `pinned-<sha10>` tag, to test unreleased upstream fixes built via
        # runtime/build-openclaw-pinned.sh or the openclaw-pinned.yml workflow.
        # Null value = forward env var only if set; otherwise Dockerfile ARG default applies.
        OPENCLAW_REPO: "${OPENCLAW_REPO:-ghcr.io/openclaw/openclaw}"
        OPENCLAW_TAG:
    ports:
      - "127.0.0.1:8001:8001"
      - "${OPENCLAW_PORT_GATEWAY:-7788}:7788"
      - "${OPENCLAW_PORT_VNC:-6080}:6080"
    volumes:
      - ./data:/data
      # Bundle: openclaw.json + workspaces templates + shared-skills (readable on host)
      - ./.openclaw/openclaw-config-bundle:/opt/config-bundle
      # Runtime OpenClaw home: workspace-*/MEMORY.md, agents, synced from bundle on startup
      - ./.openclaw/openclaw-state:/home/node/.openclaw
      # Developer-only: when SELLERCLAW_CLI_LOCAL_PATH is set in dev.env, mount the local
      # sellerclaw-cli checkout so the entrypoint can `uv pip install -e` it system-wide
      # without an image rebuild. When unset, the always-empty .no-local-cli/ placeholder
      # is mounted and the entrypoint detects no pyproject.toml → no-op. Never populated
      # in production / CI (dev.env is gitignored).
      - "${SELLERCLAW_CLI_LOCAL_PATH:-./runtime/.no-local-cli}:/opt/sellerclaw-cli-src:ro"
    environment:
      SELLERCLAW_DATA_DIR: /data
      SELLERCLAW_API_URL: "${SELLERCLAW_API_URL:-http://host.docker.internal:8000}"
      SELLERCLAW_WEB_URL: "${SELLERCLAW_WEB_URL:-http://localhost:5173}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      SELLERCLAW_LOCAL_API_KEY: "${SELLERCLAW_LOCAL_API_KEY:-}"
      SELLERCLAW_EDGE_PING: "${SELLERCLAW_EDGE_PING:-1}"
      OPENCLAW_BUNDLE_VOLUME_PATH: /opt/config-bundle
      OPENCLAW_GATEWAY_HTTP_BASE: "${OPENCLAW_GATEWAY_HTTP_BASE:-http://127.0.0.1:7789}"
      OPENCLAW_PORT_GATEWAY: "${OPENCLAW_PORT_GATEWAY:-7788}"
      OPENCLAW_PORT_VNC: "${OPENCLAW_PORT_VNC:-6080}"
      # OpenClaw log verbosity (trace|debug|info|warn|error). Overrides the
      # rendered config's logging.level at runtime. Default warn; for delivery/wake
      # diagnostics: OPENCLAW_LOG_LEVEL=debug docker compose up -d server
      OPENCLAW_LOG_LEVEL: "${OPENCLAW_LOG_LEVEL:-debug}"
      # Pre-hydration fallback only. The sentinel keeps OpenClaw's
      # `isProviderApiKeyConfigured({ provider: "google" })` gate satisfied so the
      # `video_generate` tool surfaces even before a config is fetched. At startup
      # `openclaw_start` (hydrate_gemini_passthrough_key) overrides this with the per-agent
      # LiteLLM virtual key from `models.providers.google.apiKey`: the lazy google video
      # provider authenticates via this env var (NOT the config block — only the gate reads
      # that), and the SellerClaw `/litellm/gemini` passthrough validates the virtual key
      # before substituting the real upstream key. The sentinel survives only when the config
      # has no google provider (i.e. video isn't configured for the agent).
      GEMINI_API_KEY: "${GEMINI_API_KEY:-litellm-passthrough}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
