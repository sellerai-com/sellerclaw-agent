name: Build Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the image (without leading v)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Extract version and image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ -z "$version" ]]; then
            echo "Version must be non-empty" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Git tags aren't tied to a branch, so the channel lives in the version string
          # (same model openclaw uses). A SemVer pre-release segment — a hyphen, e.g.
          # v0.58.0-rc.1 cut from `dev` — is a pre-release; a clean vX.Y.Z from `main` is the
          # real release. Pre-releases are marked "Pre-release" on GitHub and roll the `:beta`
          # image tag instead of overwriting `:latest`.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "Building version: ${version} (prerelease=${prerelease})"
          echo "Image: ${image}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  # Gate the image on a green suite, run against the SAME tag the image is built from. Without this
  # a red test run and a published image can coexist: the tag push builds and ships regardless, and
  # a developer's local `make release` gate can pass on a tree whose CI checkout is broken (an
  # ignored-but-required test fixture, a file never committed — green on the dev box, red in a clean
  # clone). Nothing downstream runs unless this is green.
  verify:
    name: Lint + type-check + tests (Python ${{ matrix.python-version }})
    needs: [resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag being released — not the default branch. Same guarantee the build job makes.
          ref: v${{ needs.resolve.outputs.version }}
          # hatch-vcs derives the package version from git tags, so a shallow clone leaves
          # `uv sync` unable to build the project itself.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # --locked: verify the tag against the exact dependency set it was cut with. An image build must
      # never re-resolve — that is how a dependency published the same afternoon turns a release into a
      # burnt tag (it cost sellerclaw-cli the v0.43.0b6 tag on 2026-07-28).
      - name: Install dependencies
        run: uv sync --extra server --locked --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run --extra server ruff check sellerclaw_agent tests

      - name: Pyright
        run: uv run --extra server pyright

      - name: Unit tests
        run: uv run --extra server python -m pytest tests -m unit

  # One job per architecture, each on a runner of that architecture. The alternative —
  # a single job emitting both platforms — would build arm64 under QEMU, where the Node,
  # Playwright and apt steps in runtime/Dockerfile take hours. Native ARM runners are free
  # for public repositories, so both halves build at roughly the same speed and in parallel.
  # Each half pushes an untagged image identified by its digest; `merge` then joins them
  # into one multi-platform tag. No tag ever points at a half-built pair.
  build:
    name: Build server image (${{ matrix.platform }})
    needs: [resolve, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout (into sellerclaw-agent/)
        uses: actions/checkout@v5
        with:
          # Always build the source of the tag matching the resolved version, even on a manual
          # workflow_dispatch. Otherwise a dispatch could stamp a fresh version onto a stale
          # source tree (how 0.53.0 shipped CLI 0.23.0). v<version> == the triggering tag on a
          # tag push, so this is a no-op there and a hard guarantee on manual builds.
          ref: v${{ needs.resolve.outputs.version }}
          path: sellerclaw-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sellerclaw-agent/runtime/Dockerfile
          target: staging
          platforms: ${{ matrix.platform }}
          build-args: |
            SELLERCLAW_AGENT_VERSION=${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Per-architecture cache refs: one shared ref would have each build overwrite the
          # other's layers and neither would ever hit.
          cache-from: type=registry,ref=${{ needs.resolve.outputs.image }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.resolve.outputs.image }}:cache-${{ matrix.arch }},mode=max

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform tags
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        shell: bash
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Always tag the exact version. The rolling tag depends on the channel: a stable
          # release moves `:latest`; a pre-release moves `:beta` and never touches `:latest`,
          # so a dev beta can't overwrite the image production pulls.
          if [[ "$PRERELEASE" == "true" ]]; then rolling="beta"; else rolling="latest"; fi
          # Guard against publishing a single-arch tag if a matrix leg silently produced nothing.
          count="$(ls -1 | wc -l)"
          if [[ "$count" -ne 2 ]]; then
            echo "Expected 2 per-architecture digests, found ${count}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${rolling}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "rolling=${rolling}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Write image info to job summary
        shell: bash
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ROLLING: ${{ steps.manifest.outputs.rolling }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          package_name="${IMAGE##*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          package_url="https://github.com/${owner}/${GITHUB_REPOSITORY#*/}/pkgs/container/${package_name}"
          {
            echo "## GHCR image"
            echo ""
            echo "- Image: \`${IMAGE}:${VERSION}\` (linux/amd64 + linux/arm64)"
            echo "- Also tagged: \`${IMAGE}:${ROLLING}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pull: \`docker pull ${IMAGE}:${VERSION}\`"
            echo "- Registry: ${package_url}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub release
    needs: [resolve, merge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="${IMAGE##*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          package_url="https://github.com/${owner}/${repo_name}/pkgs/container/${package_name}"
          if [[ "${PRERELEASE}" == "true" ]]; then
            rolling="beta"
            channel_note="**Pre-release** (cut from \`dev\`) — this does NOT move \`${IMAGE}:latest\`."
            release_flags=(--prerelease=true --latest=false)
          else
            rolling="latest"
            channel_note="Stable release — marked \"Latest\"."
            release_flags=(--prerelease=false --latest=true)
          fi
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$prev_tag" ]]; then
            changes="$(git log --pretty=format:'- %s (%h)' "${prev_tag}..${TAG}")"
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev_tag}...${TAG}"
          else
            changes="$(git log --pretty=format:'- %s (%h)' "${TAG}")"
            compare=""
          fi
          notes_file="$(mktemp)"
          {
            echo "## Install"
            echo ""
            echo "\`\`\`bash"
            if [[ "${PRERELEASE}" == "true" ]]; then
              echo "curl -fsSL https://get.sellerclaw.ai/agent.sh | sh -s -- --version ${VERSION}"
            else
              echo "curl -fsSL https://get.sellerclaw.ai/agent.sh | sh"
            fi
            echo "\`\`\`"
            echo ""
            echo "Already installed? \`sellerclaw-agent update\`."
            echo ""
            echo "## Docker image"
            echo ""
            echo "${channel_note}"
            echo ""
            echo "Published to GHCR for linux/amd64 and linux/arm64: [\`${IMAGE}:${VERSION}\`](${package_url})"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "Also available as \`${IMAGE}:${rolling}\`."
            echo ""
            echo "## Changes"
            echo ""
            echo "${changes:-_no commits_}"
            if [[ -n "$compare" ]]; then
              echo ""
              echo "**Full diff:** ${compare}"
            fi
          } > "$notes_file"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file "$notes_file" "${release_flags[@]}"
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file "$notes_file" "${release_flags[@]}"
          fi

          {
            echo "## Release"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Image: [\`${IMAGE}:${VERSION}\`](${package_url})"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
