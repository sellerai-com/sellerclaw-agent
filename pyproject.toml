[project]
name = "sellerclaw-agent"
dynamic = ["version"]
description = "SellerClaw edge agent (OpenClaw wrapper) with CLI onboarding"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
    "sellerclaw-cli>=0.7.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "watchfiles>=1.0",
    "websockets>=14.0",
]
cli = [
    "rich>=13.0",
    "questionary>=2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "runtime/commands"]
addopts = ["--import-mode=importlib"]
markers = [
    "unit: unit tests (isolated, no external deps)",
]

[tool.pyright]
extraPaths = ["runtime/commands"]

[project.scripts]
sellerclaw-agent = "sellerclaw_agent.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Allow building when the source tree is not a git checkout (e.g. installed
# from a GitHub "Download ZIP" tarball, which omits .git). Without this,
# hatch-vcs aborts the build with "setuptools-scm was unable to detect version".
fallback-version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "sellerclaw_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sellerclaw_agent"]
