worker_processes 1;
daemon off;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /tmp/nginx/access.log;
    error_log /tmp/nginx/error.log warn;

    # OpenClaw gateway (Control UI + API).
    server {
        listen 7788;
        listen [::]:7788;
        server_name _;

        location /internal/browser-status {
            proxy_pass http://127.0.0.1:7800/json/list;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:7800;
            proxy_set_header Connection close;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            error_page 502 504 = @browser_inactive;
        }

        location @browser_inactive {
            default_type application/json;
            return 200 '[]';
        }

        location / {
            proxy_pass http://127.0.0.1:7789;
            proxy_http_version 1.1;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Forward the address the request actually came from. Hardcoding 127.0.0.1
            # here used to buy trust; since OpenClaw added ingress attribution it costs
            # it: a forwarded client address that is itself loopback names no client, so
            # the gateway answers 403 proxy_attribution_required on every
            # gateway-authenticated route -- the Control UI on this port included. Paired
            # with a trustedProxies list narrowed to this nginx hop (see
            # config_generator.py), a host caller is now attributed to its real address.
            # Callers inside the container do not come through here at all: they use
            # OPENCLAW_GATEWAY_HTTP_BASE (the gateway's own loopback listener).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Restore full default operator scopes for HTTP callers that hit the
            # gateway via this nginx hop (sellerclaw-cli HTTP probes, any plugin
            # going through 7788). OpenClaw's
            # resolveTrustedHttpOperatorScopes returns CLI_DEFAULT_OPERATOR_SCOPES
            # when this header is undefined and the request is "trusted", but
            # an explicit broad header survives older OpenClaw builds (where the
            # undefined-fallback was [] before #58493/#46997, see 2026.4.5
            # changelog) and any future change where trust evaluation rejects
            # this hop. Matches the exact set defined in dist/method-scopes-*.js:
            # ADMIN, READ, WRITE, APPROVALS, PAIRING, TALK_SECRETS. Does NOT affect the internal media-completion actor
            # (it calls 127.0.0.1:7789 directly, bypassing nginx).
            proxy_set_header x-openclaw-scopes "operator.admin,operator.read,operator.write,operator.approvals,operator.pairing,operator.talk.secrets";
        }
    }

    # KasmVNC auth proxy -- injects Basic Auth so iframes load without a
    # credentials prompt. The ${VNC_AUTH_BASIC} placeholder is replaced by
    # envsubst at container startup (see openclaw_start).
    server {
        listen 6081;
        listen [::]:6081;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_buffering off;

            proxy_set_header Authorization "${VNC_AUTH_BASIC}";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_hide_header Cross-Origin-Embedder-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
        }
    }
}
