[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=node:node

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:kasmvnc]
command=/bin/bash -lc "/usr/local/bin/kasmvnc_start"
user=node
priority=10
autostart=false
autorestart=true
; A healthy kasmvnc stays up indefinitely; 3 quick retries is plenty to
; ride out one stale lock or a transient port race, and avoids the noisy
; "10 retries in 60 s -> FATAL" spam seen when the launcher fails for a
; real reason (env mis-configuration, missing binary, ...).
startretries=3
; Give vncserver time to actually bind X11 before we trust it. The KasmVNC
; binary forks, opens the socket, then settles ICE; on a healthy boot this
; takes a couple of seconds, on a failing boot it dies in ~0.3 s. Treating
; that as a successful start lets supervisord burn all retries instantly.
startsecs=3
environment=HOME="/home/node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gost]
command=/bin/bash -lc "/usr/local/bin/gost_start"
priority=35
autostart=false
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:state-dir-fix]
command=/bin/bash -lc 'd="${SELLERCLAW_DATA_DIR:-/data}"; b="${OPENCLAW_BUNDLE_VOLUME_PATH:-/opt/config-bundle}"; mkdir -p "$d" "$b" /home/node/.openclaw /home/node/.cache && chown -R node:node "$d" "$b" /home/node/.openclaw /home/node/.cache'
priority=38
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openclaw]
command=/bin/bash -lc "/usr/local/bin/openclaw_start gateway"
user=node
priority=40
autostart=true
autorestart=true
startretries=10
environment=DISPLAY=":1",HOME="/home/node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
