[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=node:node

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:agent-server]
command=/bin/bash -lc "exec python -m uvicorn sellerclaw_agent.server.app:app --host 0.0.0.0 --port 8001"
directory=/app
user=node
priority=36
autostart=true
autorestart=true
startretries=5
environment=HOME="/home/node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:kasmvnc]
command=/bin/bash -lc "/usr/local/bin/kasmvnc_start"
user=node
priority=10
autostart=false
autorestart=true
; A healthy kasmvnc stays up indefinitely; 3 quick retries is plenty to
; ride out one stale lock or a transient port race, and avoids the noisy
; "10 retries in 60 s -> FATAL" spam seen when the launcher fails for a
; real reason.
startretries=3
; Give vncserver time to bind X11 before we trust it (see comment in
; supervisord.conf for rationale).
startsecs=3
environment=HOME="/home/node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gost]
command=/bin/bash -lc "/usr/local/bin/gost_start"
priority=35
autostart=false
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; /home/node/.openclaw is deliberately NOT in this list: /entrypoint.sh already
; chowns it synchronously before supervisord starts. Doing it here as well was a
; race — this program runs with startsecs=0, so supervisord does not wait for the
; chown to finish, and once the mem0 plugin got baked into the image the crawl
; grew to tens of thousands of files and openclaw (priority=40) started losing it.
[program:state-dir-fix]
command=/bin/bash -lc 'd="${SELLERCLAW_DATA_DIR:-/data}"; b="${OPENCLAW_BUNDLE_VOLUME_PATH:-/opt/config-bundle}"; mkdir -p "$d" "$b" /home/node/.cache && chown -R node:node "$d" "$b" /home/node/.cache'
priority=38
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openclaw]
command=/bin/bash -lc "/usr/local/bin/openclaw_start gateway"
user=node
priority=40
autostart=false
autorestart=true
startretries=10
environment=DISPLAY=":1",HOME="/home/node"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
